[package]
name = "rhizome"
version = "0.1.0"
description = "Rhizome Agent — Prime-harness chat shell (separate from Rhizome Desktop)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tuckcode/rhizome-agent"
edition = "2021"
rust-version = "1.77.2"
default-run = "RhizomeAgent"

[[bin]]
name = "RhizomeAgent"
path = "src/main.rs"

[[bin]]
name = "rhizome-tool"
path = "src/bin/rhizome_tool.rs"

[lib]
name = "rhizome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Content fingerprints for import dedup (session_import). Already in the tree
# as a transitive dependency, so declaring it adds no new compiled code.
sha2 = "0.10"
serde_yaml = "0.9"
log = "0.4"
notify = "6.1"
tauri = { version = "2.10.0", features = ["macos-private-api", "protocol-asset", "devtools", "image-png", "tray-icon"] }
tauri-plugin-log = "2"
gray_matter = "0.2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
base64 = "0.22"
regex = "1"
ironcalc_base = "0.7.1"
csv = "1.4"
dirs = "5"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "4.0.4"
sentry = "0.37"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
fs4 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tantivy = "0.22.1"
fastembed = { version = "5.17.2", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "objc2-app-kit"] }

# Provider keys use the Secret Service on Linux (ADR-0185).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
