<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/components/BootSplash.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media=print + onload → non-blocking; cold launch must not wait on fonts.googleapis.com -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      (function () {
        function isResizeObserverLoopMessage(message) {
          return typeof message === 'string'
            && (
              message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1
              || message.indexOf('ResizeObserver loop limit exceeded') !== -1
            );
        }
        window.addEventListener('error', function (event) {
          if (isResizeObserverLoopMessage(event.message)) {
            event.preventDefault();
          }
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason && (event.reason.stack || event.reason.message || String(event.reason));
          if (isResizeObserverLoopMessage(reason)) {
            event.preventDefault();
          }
        });

        try {
          if (new URLSearchParams(window.location.search).get('window') === 'ai-workspace') {
            document.documentElement.classList.add('ai-workspace-native-window');
          }
        } catch {
          // Leave the normal app chrome untouched if URL parsing is unavailable.
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        background: #0F110C;
        color: #E9E8DC;
        --primary: #7DF0AE;
        --text-primary: #E9E8DC;
        --text-muted: #999784;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        background: #ECE6DA;
        color: #2A251E;
        --primary: #2C6A4D;
        --text-primary: #2A251E;
        --text-muted: #625A4D;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        background: #0F110C;
        color: #E9E8DC;
        --primary: #7DF0AE;
        --text-primary: #E9E8DC;
        --text-muted: #999784;
      }
      :root[data-color-theme="loam"] {
        color-scheme: dark;
        background: #15110C;
        color: #EDE6D8;
        --primary: #6FE3A0;
        --text-primary: #EDE6D8;
        --text-muted: #A3987F;
      }
      :root[data-accent="red"] { --primary: #C03D30; }
      :root[data-accent="orange"] { --primary: #B4552D; }
      :root[data-accent="yellow"] { --primary: #B08A25; }
      :root[data-accent="green"] { --primary: #3D6A1E; }
      :root[data-accent="purple"] { --primary: #7C5CB8; }
      :root[data-accent="pink"] { --primary: #B84A7E; }
      :root[data-accent="gray"] { --primary: #6E7867; }
      :root[data-theme="dark"][data-accent="red"] { --primary: #E8837C; }
      :root[data-theme="dark"][data-accent="orange"] { --primary: #E0A458; }
      :root[data-theme="dark"][data-accent="yellow"] { --primary: #E4C97A; }
      :root[data-theme="dark"][data-accent="green"] { --primary: #9BCF7E; }
      :root[data-theme="dark"][data-accent="purple"] { --primary: #B4A0E8; }
      :root[data-theme="dark"][data-accent="pink"] { --primary: #E594BB; }
      :root[data-theme="dark"][data-accent="gray"] { --primary: #9AA491; }
      body {
        background: inherit;
        color: inherit;
        margin: 0;
      }
      :root.ai-workspace-native-window,
      :root.ai-workspace-native-window body {
        background: transparent;
        height: 100%;
        margin: 0;
        overflow: hidden;
        width: 100%;
      }
      :root.ai-workspace-native-window body {
        box-sizing: border-box;
        padding: 20px;
      }
      :root.ai-workspace-native-window #root {
        background: #0F110C;
        border: 1px solid #2A281D;
        border-radius: 12px;
        box-sizing: border-box;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.30), 0 1px 4px rgba(0, 0, 0, 0.22);
        height: 100%;
        overflow: hidden;
        width: 100%;
      }
      :root.ai-workspace-native-window[data-theme="light"] #root {
        background: #F1ECE2;
        border-color: #DDD4C3;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.10);
      }
      :root.ai-workspace-native-window[data-theme="dark"] #root {
        background: #0F110C;
        border-color: #2A281D;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.30), 0 1px 4px rgba(0, 0, 0, 0.22);
      }
      :root.ai-workspace-native-window[data-color-theme="loam"] #root {
        background: #15110C;
        border-color: #352C20;
      }
    </style>
    <title>Rhizome Agent</title>
  </head>
  <body>
    <script>
      (function () {
        /* rhizome-boot-appearance */
        var themeKey = 'rhizome-theme';
        var legacyThemeKey = 'tolaria-theme';
        var colorThemeKey = 'rhizome-color-theme';
        var legacyColorThemeKey = 'tolaria-color-theme';
        var accentKey = 'rhizome-accent';
        var legacyAccentKey = 'tolaria-accent';
        var systemDarkQuery = '(prefers-color-scheme: dark)';
        // Mirrors COLOR_THEMES in src/lib/themeMode.ts — keep in sync. Fixed
        // themes pin the resolved mode to their polarity so there is no
        // flash even when the mode toggle disagrees (e.g. system=light but
        // the chosen fixed theme is dark).
        var THEME_POLARITY = {
          dracula: 'dark', nord: 'dark', 'gruvbox-dark': 'dark', 'gruvbox-light': 'light',
          'solarized-light': 'light', 'solarized-dark': 'dark', 'catppuccin-mocha': 'dark',
          'catppuccin-latte': 'light', 'tokyo-night': 'dark', 'one-dark': 'dark',
          'rose-pine': 'dark', 'github-light': 'light', everforest: 'dark', 'monokai-pro': 'dark',
          loam: 'dark',
        };
        var ACCENT_KEYS = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'gray'];
        function normalizeTheme(value) {
          return value === 'dark' || value === 'light' || value === 'system' ? value : null;
        }
        function normalizeColorTheme(value) {
          return value === 'rhizome' || Object.prototype.hasOwnProperty.call(THEME_POLARITY, value) ? value : null;
        }
        function normalizeAccent(value) {
          return ACCENT_KEYS.indexOf(value) !== -1 ? value : null;
        }
        function prefersDarkTheme() {
          try {
            if (typeof window.matchMedia !== 'function') return true;
            return window.matchMedia(systemDarkQuery).matches;
          } catch {
            return true;
          }
        }
        function resolveTheme(value) {
          var mode = normalizeTheme(value) || 'dark';
          return mode === 'system' ? (prefersDarkTheme() ? 'dark' : 'light') : mode;
        }
        function applyTheme(modeValue, colorThemeValue, accentValue) {
          var colorTheme = normalizeColorTheme(colorThemeValue) || 'rhizome';
          var accent = normalizeAccent(accentValue) || 'blue';
          var polarity = THEME_POLARITY[colorTheme];
          var mode = polarity || resolveTheme(modeValue);

          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.toggle('dark', mode === 'dark');

          if (colorTheme === 'rhizome') {
            document.documentElement.removeAttribute('data-color-theme');
          } else {
            document.documentElement.setAttribute('data-color-theme', colorTheme);
          }
          if (colorTheme === 'rhizome' && accent !== 'blue') {
            document.documentElement.setAttribute('data-accent', accent);
          } else {
            document.documentElement.removeAttribute('data-accent');
          }
        }
        function readStored(currentKey, legacyKey, normalize) {
          var current = normalize(localStorage.getItem(currentKey));
          if (current !== null) return current;
          var legacy = normalize(localStorage.getItem(legacyKey));
          if (legacy === null) return null;
          try {
            localStorage.setItem(currentKey, legacy);
          } catch {
            // A read-only store still keeps the legacy value for this paint.
          }
          return legacy;
        }
        try {
          applyTheme(
            readStored(themeKey, legacyThemeKey, normalizeTheme),
            readStored(colorThemeKey, legacyColorThemeKey, normalizeColorTheme),
            readStored(accentKey, legacyAccentKey, normalizeAccent)
          );
        } catch {
          applyTheme('dark', null, null);
        }
      })();
    </script>
    <script>
      (function () {
        /* rhizome-boot-motion */
        var readyEventName = 'tolaria:frontend-ready';
        var reloadAttemptKey = 'tolaria:startup-reload-attempted';
        var startupTimeoutMs = 10000;
        var isTauri = '__TAURI__' in window || '__TAURI_INTERNALS__' in window;
        var seenVisible = false;

        function applyBootMotion(state) {
          document.documentElement.style.setProperty('--boot-motion-state', state);
          document.documentElement.setAttribute('data-boot-motion', state);
        }

        function syncBootMotion() {
          if (!document.hidden) seenVisible = true;
          // WKWebView / Tauri often reports document.hidden at first paint.
          // Pausing then, with fill:both grow-in, freezes two arms at opacity 0
          // if visibilitychange never fires when the window is shown.
          applyBootMotion(document.hidden && seenVisible ? 'paused' : 'running');
        }

        if (typeof window.__rhizomeUnbindBootMotion === 'function') {
          window.__rhizomeUnbindBootMotion();
        }

        function releaseBootMotion() {
          document.removeEventListener('visibilitychange', syncBootMotion);
          document.documentElement.style.removeProperty('--boot-motion-state');
          document.documentElement.removeAttribute('data-boot-motion');
        }

        window.__rhizomeUnbindBootMotion = function () {
          document.removeEventListener('visibilitychange', syncBootMotion);
          window.removeEventListener(readyEventName, releaseBootMotion);
          delete window.__rhizomeUnbindBootMotion;
        };

        syncBootMotion();
        document.addEventListener('visibilitychange', syncBootMotion);
        window.addEventListener(readyEventName, releaseBootMotion, { once: true });

        if (!isTauri) return;

        function hasReloadAttempted() {
          try {
            return sessionStorage.getItem(reloadAttemptKey) === '1';
          } catch {
            return true;
          }
        }

        function markReloadAttempted() {
          try {
            sessionStorage.setItem(reloadAttemptKey, '1');
            return true;
          } catch {
            return false;
          }
        }

        function clearReloadAttempt() {
          try {
            sessionStorage.removeItem(reloadAttemptKey);
          } catch {
            // Storage can be unavailable in hardened WebView/privacy modes.
          }
        }

        window.addEventListener(readyEventName, clearReloadAttempt, { once: true });
        window.setTimeout(function () {
          if (window.__rhizomeFrontendReady === true) return;
          if (hasReloadAttempted()) return;
          if (!markReloadAttempted()) return;

          window.location.reload();
        }, startupTimeoutMs);
      })();
    </script>
    <script>
      window.__rhizomeBootStartedAt = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    </script>
    <div id="root">
      <div id="rhizome-boot-splash" class="boot-splash" aria-busy="true" aria-label="Loading Rhizome" role="status">
        <!-- Mirrors BrandMark.tsx so the first paint and React fallback agree. -->
        <div class="boot-splash-card">
        <svg viewBox="0 0 100 100" width="56" height="56" fill="none" aria-hidden="true">
          <defs>
            <radialGradient id="boot-node-material" cx="28%" cy="22%" r="78%">
              <stop offset="0" class="boot-node-highlight" />
              <stop offset="0.52" class="boot-node-color" />
              <stop offset="1" class="boot-node-shade" />
            </radialGradient>
            <radialGradient id="boot-core-material" cx="28%" cy="22%" r="78%">
              <stop offset="0" class="boot-core-highlight" />
              <stop offset="0.52" class="boot-core-color" />
              <stop offset="1" class="boot-core-shade" />
            </radialGradient>
          </defs>
          <path d="M50 52 L20 27" stroke-width="3" stroke-linecap="round" />
          <path d="M50 52 L81 23" stroke-width="3" stroke-linecap="round" />
          <path d="M50 52 L24 79" stroke-width="3" stroke-linecap="round" />
          <path d="M50 52 L77 75" stroke-width="3" stroke-linecap="round" />
          <path d="M50 52 L50 15" stroke-width="3" stroke-linecap="round" />
          <circle cx="50" cy="52" r="12" />
          <circle cx="20" cy="27" r="7" />
          <circle cx="81" cy="23" r="8" />
          <circle cx="24" cy="79" r="6.5" />
          <circle cx="77" cy="75" r="7.5" />
          <circle cx="50" cy="15" r="5" />
        </svg>
        <div class="boot-splash-wordmark">rhizome</div>
        <div class="boot-splash-status">Starting…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
