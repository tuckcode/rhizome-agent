name: Landing page

# Publishes website/ to GitHub Pages. Release workflows run the same
# website/build.sh, so a release deploy keeps the landing page.
#
# This job only queues when one of the paths below changes. That is why
# it last ran on 2026-09-27 (8ed9817) while main kept moving: no later
# commit touched website/, the hero assets, or this file. GitHub did not
# disable Pages and the last run succeeded. A merge that touches these
# paths deploys; Actions → Landing page → Run workflow also deploys.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/assets/**'
      - 'src/assets/brand/rhizome-organic-hero.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages on a free plan needs a public repo; skip quietly while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build landing page
        run: bash website/build.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
